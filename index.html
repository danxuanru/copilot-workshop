<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="todo-card">
        <h1>待辦清單</h1>

        <div class="input-row">
          <input
            id="todo-input"
            type="text"
            placeholder="輸入待辦事項"
            aria-label="新增待辦事項"
          />
          <button id="add-btn" type="button">新增</button>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <div id="empty-state" class="empty-state" aria-live="polite">
          還沒有任何待辦事項,新增一個吧!
        </div>

        <footer class="summary">未完成: <span id="remaining-count">0</span> 項</footer>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
