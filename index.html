<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="todo-card">
        <header class="top-bar">
          <h1>待辦清單</h1>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切換深色模式">
            <span class="theme-icon" aria-hidden="true">🌙</span>
            <span class="theme-label">深色模式</span>
          </button>
        </header>

        <div class="input-row">
          <input
            id="todo-input"
            type="text"
            placeholder="輸入待辦事項"
            aria-label="新增待辦事項"
          />
          <button id="add-btn" type="button">新增</button>
        </div>

        <div class="filter-row" aria-label="待辦篩選">
          <button class="filter-btn active" type="button" data-filter="all">全部</button>
          <button class="filter-btn" type="button" data-filter="active">未完成</button>
          <button class="filter-btn" type="button" data-filter="completed">已完成</button>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <div id="empty-state" class="empty-state" aria-live="polite">
          還沒有任何待辦事項,新增一個吧!
        </div>

        <footer class="summary">未完成: <span id="remaining-count">0</span> 項</footer>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
